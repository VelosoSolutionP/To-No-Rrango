# Produção: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Aplica as migrações do banco ao subir; sem isso o código novo roda com o banco antigo.
      Database__MigrateOnStartup: "true"
      Admin__ApiKey: "${TNR_ADMIN_KEY:?defina TNR_ADMIN_KEY no .env}"
      App__PublicWebUrl: "https://to-no-rango.velososolution.com.br"
      App__PublicApiUrl: "https://to-no-rango.velososolution.com.br"
      Cors__AllowedOrigins__0: "https://to-no-rango.velososolution.com.br"
      Network__TrustForwardedHeaders: "true"
      VelosoId__PortalWebUrl: "https://velososolution.com.br"
      VelosoId__PortalApiUrl: "http://172.17.0.1:8081"
      VelosoId__RootSecret: "${TNR_VELOSO_ID_RAIZ:-}"
      VelosoId__RedirectUri: "https://to-no-rango.velososolution.com.br/admin"
      VelosoId__PasswordLoginEnabled: "false"
      VelosoId__OwnerEmail: "dono@tonorango.velososolution.com.br"
      # Convite do contador sai por e-mail (mesma conta SMTP do resto da Veloso Solution). Sem usuário/senha, fica desligado.
      Email__Host: "${TNR_SMTP_HOST:-smtp.zoho.com}"
      Email__Port: "${TNR_SMTP_PORT:-465}"
      Email__User: "${TNR_SMTP_USER:-}"
      Email__Password: "${TNR_SMTP_PASS:-}"
      Email__From: "${TNR_SMTP_FROM:-}"
      Email__Name: "To No Rango"
      # Consulta de produtos por código de barras; sem usuário, o botão avisa que não está configurado.
      Gtin__Username: "${TNR_GTIN_USUARIO:-}"
      Gtin__Password: "${TNR_GTIN_SENHA:-}"
      # Conta Mercado Pago da Veloso (a mesma do ZEST): vale para toda loja sem conta propria.
      MercadoPago__AccessToken: "${TNR_MP_ACCESS_TOKEN:-}"
      MercadoPago__PublicKey: "${TNR_MP_PUBLIC_KEY:-}"
      MercadoPago__WebhookSecret: "${TNR_MP_WEBHOOK_SECRET:-}"
      # Com o container fiscal ligado, só ele envia os webhooks: TNR_FISCAL_WORKER_NA_API=false no .env.
      FiscalApi__RunWorker: "${TNR_FISCAL_WORKER_NA_API:-true}"

  # Camada fiscal do ZEST num container próprio (mesma imagem, papel "fiscal"): API fiscal, portal de
  # parceiros e webhooks. Só sobe com: docker compose ... --profile fiscal up -d --build fiscal
  # O túnel manda /api/fiscal/v1 e /api/accountant para cá (veja docs/FISCAL-CONTAINER.md).
  fiscal:
    profiles: ["fiscal"]
    build:
      context: .
      dockerfile: src/ToNoRango.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      App__Role: fiscal
      Database__MigrateOnStartup: "false"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=tonorango;Username=tonorango;Password=tonorango"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: "${TNR_JWT_KEY:-}"
      Security__EncryptionKey: "${TNR_ENCRYPTION_KEY:-}"
      Admin__ApiKey: "${TNR_ADMIN_KEY:?defina TNR_ADMIN_KEY no .env}"
      App__PublicWebUrl: "https://to-no-rango.velososolution.com.br"
      App__PublicApiUrl: "https://to-no-rango.velososolution.com.br"
      Cors__AllowedOrigins__0: "https://to-no-rango.velososolution.com.br"
      Network__TrustForwardedHeaders: "true"
    depends_on:
      - api

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "https://to-no-rango.velososolution.com.br"
    image: tonorango-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports: !override
      - "127.0.0.1:3011:3000"
    volumes: !reset []
    command: ["npm", "run", "start"]
    depends_on:
      - api

  # Túnel próprio do To-No-Rango: não depende do túnel dos outros sites.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "1000:1000"
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ${HOME}/.cloudflared/tonorango:/etc/cloudflared:ro
    depends_on:
      - api
      - web
